[project]
name = "laya-apple-phase0-feasibility"
version = "0.0.0"
description = "Phase -1 feasibility experiments for laya-apple (research only, not the runtime)."
requires-python = "==3.12.*"
# Pinned so every measurement in raw/ can be reproduced. coremltools 9.0 is only
# validated against torch 2.7.0 and numpy < 2.2 (see laya-coreml docs/CONVERSION.md).
dependencies = [
    "torch==2.7.0",
    "numpy==2.1.3",
    "coremltools==9.0",
    "transformers==5.17.0",
    "tokenizers==0.23.2",
    "safetensors==0.8.0",
    "huggingface-hub==1.32.0",
    "mlx==0.32.2",
    "psutil==7.2.2",
    # Reference implementations, pinned to exact commits.
    "laya @ git+https://github.com/NandhaKishorM/laya@573e5b62696ba441230cd6be71d593331b5d23af",
    "laya-mlx @ git+https://github.com/mizorewww/laya-mlx@0a859518634112655cb97c745dbf04f5191aaf13",
    "laya-coreml @ git+https://github.com/mizorewww/laya-coreml@4619e0483f07adf39068532e85b42ec2347edb83",
]

[tool.uv]
package = false
