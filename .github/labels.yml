# Label set for tc3oliver/laya-apple.
#
# Consumed by scripts/github_seed.sh, which creates or updates each label with
# `gh label create --force` (idempotent). Colors are 6-digit hex, no leading `#`
# in this file's convention below (the script adds it when calling gh).

- name: "good first issue"
  color: "7057ff"
  description: "Small, self-contained, no ANE hardware required"
- name: "help wanted"
  color: "008672"
  description: "Needs a contributor with specific hardware or domain knowledge"
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working as documented"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement to existing behavior"
- name: "benchmark"
  color: "fbca04"
  description: "Benchmark suite, reporting, or hardware result contributions"
- name: "hardware"
  color: "c5def5"
  description: "Needs a specific Apple SoC, macOS version, or physical machine to validate"
- name: "coreml"
  color: "bfd4f2"
  description: "Core ML artifact build, conversion, or runtime backend"
- name: "mlx"
  color: "bfd4f2"
  description: "MLX GPU backend"
- name: "ane"
  color: "bfd4f2"
  description: "Apple Neural Engine backend, placement, or validation"
- name: "scheduler"
  color: "d4c5f9"
  description: "Routing, queueing, or heterogeneous GPU+ANE execution"
- name: "correctness"
  color: "e11d21"
  description: "Parity gate, golden data, or answer-changing behavior"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to docs"
- name: "research"
  color: "5319e7"
  description: "Exploratory investigation, not a shippable feature by itself"
- name: "performance"
  color: "f9d0c4"
  description: "Latency, throughput, or resource-usage improvements"
