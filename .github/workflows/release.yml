name: Release

# Publishes to PyPI with Trusted Publishing (GitHub OIDC); no PyPI token or password is
# stored anywhere. See docs/publishing.md.
#
# - Pushing a version tag (vX.Y.Z) builds and publishes that tag.
# - workflow_dispatch builds and publishes the newest EXISTING version tag. It is for tags
#   created before this workflow existed (their commit does not contain this file, so
#   pushing them again would not run it); it only runs from main and never creates or
#   moves a tag.
#
# Third-party actions are pinned to commit SHAs (tag in the trailing comment), except the
# PyPI publish action, which PyPA asks to be used from its release/v1 branch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, e.g. v1.0.1"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and check distributions
    # Apple silicon runner: the import check needs MLX, which is darwin/arm64 only.
    runs-on: macos-14
    steps:
      - name: Resolve the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            if [ "$REF" != refs/heads/main ]; then
              echo "::error::Manual releases must be dispatched from main (got $REF)"; exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag="$PUSHED_TAG"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$tag' is not a vX.Y.Z tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is on main and is the newest release tag
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"; exit 1
          fi
          newest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ "$EVENT" = workflow_dispatch ] && [ "$TAG" != "$newest" ]; then
            echo "::error::Manual releases publish only the newest tag ($newest), not $TAG"; exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version=$(uv run --no-project --python 3.12 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::pyproject.toml version $version does not match tag $TAG"; exit 1
          fi

      - name: Build
        run: uv build

      - name: Check distribution contents
        run: |
          ls dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          files=$( (unzip -Z1 dist/*.whl; tar tzf dist/*.tar.gz) )
          # Allowlist: the package, its metadata, and the sdist's top-level files. Anything
          # else (benchmarks, research, tests, local config, models) fails the release.
          allowed='^(laya_apple/|laya_apple-[^/]+\.dist-info/|laya_apple-[^/]+/($|laya_apple(/|$)|PKG-INFO$|pyproject\.toml(\.orig)?$|README\.md$|LICENSE$|NOTICE$))'
          if printf '%s\n' "$files" | grep -Ev "$allowed"; then
            echo "::error::unexpected files in the distributions (listed above)"; exit 1
          fi
          if printf '%s\n' "$files" | grep -E '\.(mlmodelc|mlpackage|safetensors|jsonl)(/|$)|__pycache__'; then
            echo "::error::model, raw-data or cache files in the distributions"; exit 1
          fi
          for f in LICENSE NOTICE; do
            printf '%s\n' "$files" | grep -q "dist-info/licenses/$f$" || { echo "::error::$f missing from the wheel"; exit 1; }
            printf '%s\n' "$files" | grep -Eq "^laya_apple-[^/]+/$f$" || { echo "::error::$f missing from the sdist"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q dist/*.whl -d "$RUNNER_TEMP/unpacked"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/unpacked"
          if grep -rIlE '/Users/|/Volumes/|/home/runner|/private/var/|/private/tmp/' "$RUNNER_TEMP/unpacked"; then
            echo "::error::local paths in the distributions"; exit 1
          fi

      - name: Check metadata
        run: uvx twine==7.0.0 check --strict dist/*

      - name: Import the built wheel
        env:
          HF_HUB_OFFLINE: "1"
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/python" - <<'EOF'
          import importlib.metadata
          import importlib.resources as r
          import os

          import laya_apple
          from laya_apple import Laya, LayaAppleError  # noqa: F401

          assert "site-packages" in laya_apple.__file__, laya_apple.__file__
          tag_version = os.environ["TAG"][1:]
          dist_version = importlib.metadata.version("laya-apple")
          assert laya_apple.__version__ == dist_version == tag_version, (
              f"__version__ {laya_apple.__version__}, metadata {dist_version}, tag {tag_version}"
          )
          data = {p.name for p in r.files("laya_apple.data").iterdir()}
          assert {"routing.json", "placement.json", "manifest.schema.json"} <= data, data
          print("laya-apple", laya_apple.__version__, "imports from", laya_apple.__file__)
          EOF
          "$RUNNER_TEMP/wheel-venv/bin/laya-apple" --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    # Never from a fork or a copy of this workflow in another repository.
    if: github.repository == 'tc3oliver/laya-apple'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/laya-apple/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
