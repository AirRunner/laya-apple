name: Bug report
description: Something in laya-apple is not working as documented.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal repro
      description: The smallest script or CLI invocation that reproduces the issue.
      render: python
    validations:
      required: true

  - type: textarea
    id: info
    attributes:
      label: laya-apple info
      description: |
        Output of `laya-apple info <model>` or `Laya.info()` for the model involved,
        including `routing_reason` if the bug is about device selection.
      render: text
    validations:
      required: true

  - type: input
    id: soc
    attributes:
      label: Apple silicon (SoC)
      placeholder: e.g. M4 Max
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 26.6.2
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: e.g. 3.12.4
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: laya-apple version
      placeholder: e.g. 1.0.0
    validations:
      required: true
