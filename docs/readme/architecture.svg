<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">laya-apple routing: requests of at most 128 tokens with one question and a validated artifact go to the Apple Neural Engine; longer, multi-question or unvalidated requests go to the MLX GPU; with execution=&quot;workers&quot; both engines serve independent requests concurrently</title>
<style>
.bg{fill:#ffffff;stroke:#d1d9e0}
.t{fill:#1f2328}.m{fill:#59636e}.acc{fill:#0969da}.gpu{fill:#8c959f}
.box{fill:#f6f8fa;stroke:#d1d9e0}.boxacc{fill:#ddf4ff;stroke:#0969da}
.ln{stroke:#59636e;fill:none}.lnacc{stroke:#0969da;fill:none}.grid{stroke:#d1d9e0}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#3d444d}
.t{fill:#e6edf3}.m{fill:#9198a1}.acc{fill:#4493f8}.gpu{fill:#656c76}
.box{fill:#151b23;stroke:#3d444d}.boxacc{fill:#0c2d6b;stroke:#4493f8}
.ln{stroke:#9198a1}.lnacc{stroke:#4493f8}.grid{stroke:#3d444d}
}
</style>
<rect x="0.5" y="0.5" width="879" height="329" rx="10" class="bg"/>
<defs><marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="m"/></marker><marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="acc"/></marker></defs>
<rect x="24" y="110" width="140" height="80" rx="8" class="box"/>
<text x="94" y="146" class="t" font-size="15" font-weight="600" text-anchor="middle">Request</text>
<text x="94" y="164" class="m" font-size="12" text-anchor="middle">predict / submit</text>
<rect x="196" y="100" width="176" height="100" rx="8" class="box"/>
<text x="284" y="137" class="t" font-size="15" font-weight="600" text-anchor="middle">Router</text>
<text x="284" y="155" class="m" font-size="12" text-anchor="middle">decides before running,</text>
<text x="284" y="173" class="m" font-size="12" text-anchor="middle">records routing_reason</text>
<rect x="620" y="24" width="236" height="96" rx="8" class="boxacc"/>
<text x="738" y="59" class="t" font-size="15" font-weight="600" text-anchor="middle">Apple Neural Engine</text>
<text x="738" y="77" class="m" font-size="12" text-anchor="middle">Core ML fixed-shape artifact,</text>
<text x="738" y="95" class="m" font-size="12" text-anchor="middle">parity-validated on this Mac</text>
<rect x="620" y="180" width="236" height="96" rx="8" class="box"/>
<text x="738" y="215" class="t" font-size="15" font-weight="600" text-anchor="middle">MLX GPU</text>
<text x="738" y="233" class="m" font-size="12" text-anchor="middle">up to the model&#x27;s max length,</text>
<text x="738" y="251" class="m" font-size="12" text-anchor="middle">batches multiple questions</text>
<line x1="164" y1="150" x2="192" y2="150" class="ln" stroke-width="1.6" marker-end="url(#hm)"/>
<path d="M372,140 H404 V72 H616" class="lnacc" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ha)"/>
<path d="M372,160 H404 V228 H616" class="ln" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#hm)"/>
<text x="512" y="44" class="acc" font-size="12" text-anchor="middle">≤ 128 tokens, one question,</text>
<text x="512" y="62" class="acc" font-size="12" text-anchor="middle">validated artifact present</text>
<text x="512" y="248" class="m" font-size="12" text-anchor="middle">longer, several questions,</text>
<text x="512" y="266" class="m" font-size="12" text-anchor="middle">unvalidated Mac or no artifact</text>
<line x1="680" y1="126" x2="680" y2="174" class="ln" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="690" y="138" class="m" font-size="12">with execution=&quot;workers&quot;:</text>
<text x="690" y="154" class="m" font-size="12">serve independent</text>
<text x="690" y="170" class="m" font-size="12">requests concurrently</text>
<line x1="24" x2="856" y1="294" y2="294" class="grid"/>
<text x="24" y="316" class="m" font-size="12">Routing on an idle machine. With execution=&quot;workers&quot;, the router also compares queue backlogs, so a request can go to the other engine.</text>
</svg>
